<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpotTogether — Nghe nhạc cùng nhau</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="topbar">
        <div class="brand">
          <svg viewBox="0 0 24 24" class="brand-ico" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6" />
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" />
          </svg>
          <div>
            <h1>SpotTogether</h1>
            <p class="sub">Nghe Spotify cùng nhau — host điều khiển, cả phòng nghe chung.</p>
          </div>
        </div>
        <button id="logout-btn" class="icon-btn ghost" title="Đăng xuất" style="display: none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </header>

      <p id="status" class="status">Đang tải…</p>

      <button id="login-btn" class="primary big" style="display: none">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="12" fill="currentColor" opacity="0"/><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.4a.62.62 0 0 1-.86.2c-2.35-1.43-5.3-1.76-8.79-.96a.62.62 0 1 1-.28-1.22c3.8-.87 7.07-.5 9.7 1.12.3.18.4.57.23.86zm1.23-2.73a.78.78 0 0 1-1.07.26c-2.69-1.65-6.79-2.13-9.97-1.17a.78.78 0 1 1-.45-1.49c3.63-1.1 8.15-.56 11.24 1.33.37.22.48.7.25 1.07zm.1-2.85C14.82 8.96 9.4 8.77 6.3 9.71a.94.94 0 1 1-.54-1.8c3.56-1.08 9.54-.87 13.3 1.36a.94.94 0 0 1-.96 1.6z"/></svg>
        Đăng nhập Spotify
      </button>

      <section id="app" style="display: none">
        <div class="joinbar card">
          <input id="name" placeholder="Tên của bạn" />
          <input id="room-id" placeholder="Mã phòng" value="main" />
          <button id="join-btn" class="primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            Vào phòng
          </button>
        </div>

        <div id="roombar" class="roombar" style="display: none">
          <span id="room-badge" class="badge"></span>
        </div>

        <!-- Now playing -->
        <div id="now-card" class="card now" style="display: none">
          <img id="np-art" class="np-art" alt="" />
          <div class="np-meta">
            <span class="np-label">Đang phát</span>
            <strong id="np-title">—</strong>
            <span id="np-artist" class="muted"></span>
          </div>
          <div id="host-controls" class="np-controls" style="display: none">
            <button id="toggle-btn" class="icon-btn round" title="Play / Pause"></button>
            <button id="next-btn" class="icon-btn round" title="Bài tiếp theo">
              <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17" y="4" width="2.5" height="16" rx="1"/></svg>
            </button>
          </div>
        </div>

        <!-- Search -->
        <div class="card">
          <div class="card-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="head-ico"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <h3>Tìm nhạc</h3>
          </div>
          <div class="searchbar">
            <input id="search-input" placeholder="Nhập tên bài hát hoặc nghệ sĩ…" />
            <button id="search-btn" class="primary">Tìm</button>
          </div>
          <ul id="results" class="tracklist"></ul>
        </div>

        <!-- Queue -->
        <div class="card">
          <div class="card-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="head-ico"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
            <h3>Hàng đợi <span id="queue-count" class="count">0</span></h3>
          </div>
          <ul id="queue" class="tracklist"></ul>
          <p id="queue-empty" class="muted empty">Chưa có bài nào — tìm nhạc rồi thêm vào hàng đợi.</p>
        </div>

        <!-- Members -->
        <div class="card">
          <div class="card-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="head-ico"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
            <h3>Thành viên</h3>
          </div>
          <ul id="members" class="memberlist"></ul>
        </div>

        <details class="card log-card">
          <summary>Nhật ký</summary>
          <pre id="log"></pre>
        </details>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
